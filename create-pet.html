<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PetLink — Create Pet Profile</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Page-specific layout for the Create Pet screen */
    .cp-hero {
      position:relative;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background: linear-gradient(180deg,#fff,#f7d6de);
    }

    .cp-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:20px 36px;
      max-width:1200px;
      margin:0 auto;
      width:100%;
    }
    .cp-nav { display:flex; gap:22px; align-items:center; color:#222; font-weight:700; }
    .cp-logo { display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; color:#111; }

    .cp-main {
      max-width:1200px;
      margin: 24px auto 80px;
      padding: 28px;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:36px;
      align-items:start;
      width:100%;
    }

    .cp-title {
      grid-column: 1 / -1;
      font-size:48px;
      color:var(--pink);
      font-weight:800;
      margin:6px 0 18px;
    }

    .cp-uploader {
      height:320px;
      border-radius:16px;
      border:3px dashed rgba(214, 128, 140, 0.6);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,240,244,0.6));
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#a33b5a;
      font-weight:700;
      padding:18px;
      cursor:pointer;
      position:relative;
    }
    .cp-uploader input[type="file"] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; }

    .cp-uploader .hint { max-width:220px; }
    .cp-preview { width:100%; height:100%; object-fit:cover; border-radius:12px; display:block; }

    .cp-form {
      background: #9fe8d7;
      border-radius:16px;
      padding:28px;
      min-height:220px;
      position:relative;
      box-shadow: var(--glass-shadow);
    }
    .cp-form label { display:block; font-weight:700; color:#2d5b56; margin:8px 0 6px; }
    .cp-form input[type="text"], .cp-form input[type="number"]{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.06);
      margin-bottom:6px;
      outline:none;
    }
    .cp-actions { display:flex; gap:12px; margin-top:14px; align-items:center; }
    .btn-save { background: linear-gradient(180deg,var(--pink) 0%, var(--pink-deep) 100%); color:white; padding:10px 18px; border-radius:12px; border:0; font-weight:800; cursor:pointer; }
    .cp-cancel { background:transparent; border:0; color:#333; font-weight:700; cursor:pointer; text-decoration:underline; }

    /* responsive */
    @media(max-width:920px){
      .cp-main { grid-template-columns: 1fr; padding:18px; }
      .cp-uploader { height:260px; }
    }
  </style>
</head>
<body>
  <section class="cp-hero">
    <header class="cp-header">
      <div class="cp-logo"><img src="images/default-logo.png" width="36" height="36" style="border-radius:8px; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,0.06);"> PetLink</div>
      <nav class="cp-nav">
        <a href="homepage.html" class="muted">My Pets</a>
        <a href="homepage.html" class="muted">Daily care</a>
        <a href="homepage.html" title="Profile" aria-label="Profile">👤</a>
      </nav>
    </header>

    <main class="cp-main" role="main">
      <h1 class="cp-title">Create Pet Profile</h1>

      <div class="cp-uploader" id="uploader" title="Click or drag an image here to upload">
        <div class="hint">
          <div style="font-size:24px; margin-bottom:6px;">Drag & Drop</div>
          <div style="font-size:14px;">or Click to Upload</div>
        </div>
        <input id="petImageInput" type="file" accept="image/*" />
        <img id="petPreview" class="cp-preview" src="" alt="" style="display:none;" />
      </div>

      <section class="cp-form" aria-labelledby="petFormTitle">
        <h2 id="petFormTitle" style="margin:0 0 12px; color:#114a43;">Pet details</h2>

        <form id="petForm" class="form">
          <label for="petName">Name</label>
          <input id="petName" name="petName" type="text" placeholder="Pet's name" required />

          <label for="petBreed">Breed</label>
          <input id="petBreed" name="petBreed" type="text" placeholder="Breed" />

          <label for="petAge">Age (in months)</label>
          <input id="petAge" name="petAge" type="number" min="0" placeholder="e.g. 8" />

          <div class="cp-actions">
            <button type="submit" class="btn-save">Save pet profile</button>
            <button type="button" id="cancelCreate" class="cp-cancel">Cancel</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="foot" style="position:relative; bottom:0; color:#6b6b6b; opacity:0.9; pointer-events:auto;">All rights reserved</footer>
  </section>

  <script src="script.js"></script>
  <script>
    // Small client-side helper to preview image immediately.
    (function(){
      const uploader = document.getElementById('uploader');
      const input = document.getElementById('petImageInput');
      const preview = document.getElementById('petPreview');

      function showPreview(file){
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e){
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }

      uploader.addEventListener('dragover', (e) => { e.preventDefault(); uploader.style.opacity = 0.92; });
      uploader.addEventListener('dragleave', () => { uploader.style.opacity = 1; });
      uploader.addEventListener('drop', (e) => {
        e.preventDefault();
        uploader.style.opacity = 1;
        const f = e.dataTransfer.files?.[0];
        if (f && f.type.startsWith('image/')) {
          input.files = e.dataTransfer.files;
          showPreview(f);
        }
      });

      input.addEventListener('change', (e) => {
        const f = e.target.files?.[0];
        if (f && f.type.startsWith('image/')) showPreview(f);
      });
    })();
  </script>
</body>
</html>
