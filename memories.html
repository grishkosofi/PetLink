<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PetLink — Memories</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Scoped styles for Memories page */
    .mm-page { min-height:100vh; background: linear-gradient(180deg,#eaf9f3 0%, #f6d6dc 60%); padding:28px; display:flex; flex-direction:column; gap:20px; }
    .mm-main { max-width:980px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:18px; align-items:center; }
    .mm-banner {
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85));
      border-radius:32px;
      padding:14px 20px;
      display:flex;
      align-items:center;
      gap:18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      width:100%;
      justify-content:space-between;
    }
    .mm-title { font-size:28px; font-weight:800; color:var(--pink); margin:0; display:flex; align-items:center; gap:16px; }
    .mm-avatar { width:60px; height:60px; border-radius:12px; overflow:hidden; background:white; display:flex; align-items:center; justify-content:center; }

    .mem-list { width:100%; display:flex; flex-direction:column; gap:16px; margin-top:20px; align-items:center; }
    .mem-item {
      background:white; border-radius:18px; padding:14px 18px; box-shadow: 0 22px 50px rgba(0,0,0,0.06);
      display:flex; align-items:center; gap:12px; width:100%;
    }
    .mem-thumb {
      width:72px; height:72px; border-radius:12px; overflow:hidden; background:#f7f7f7; display:flex; align-items:center; justify-content:center;
    }
    .mem-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .mem-body { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .mem-date { font-size:12px; color:var(--muted); }
    .mem-text { font-size:16px; color:#222; }

    .btn-add { background:#3ab69e; color:white; padding:10px 16px; border-radius:999px; border:0; font-weight:800; cursor:pointer; box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
    .btn-back { padding:8px 12px; border-radius:999px; border:0; cursor:pointer; background:white; box-shadow:0 6px 18px rgba(0,0,0,0.06); font-weight:700; }

    @media(max-width:720px){
      .mm-banner { flex-direction:column; align-items:flex-start; gap:10px; padding:12px; }
      .mem-item { flex-direction:column; align-items:flex-start; gap:8px; }
      .mem-thumb{ width:100%; height:160px; border-radius:12px; }
    }
  </style>
</head>
<body>
<div class="mm-page">
  <header class="hp-header" style="max-width:980px; margin:0 auto;">
    <div class="hp-brand">
      <div class="hp-logo">
        <div class="hp-logo-mark"><img src="images/default-logo.png" width="36" height="36" style="border-radius:8px;background:#fff"></div>
        <div class="hp-logo-text">PetLink</div>
      </div>
    </div>

    <nav style="display:flex; gap:18px; align-items:center;">
      <button id="navMyPets" class="hp-menu-item" style="background:transparent;border:0;">My pets</button>
      <button id="navDaily" class="hp-menu-item" style="background:transparent;border:0;">Daily care</button>
      <button id="navHome" class="hp-menu-item" style="background:transparent;border:0;">Homepage</button>
      <div class="hp-user" style="cursor:default;"><div class="hp-user-name" id="mmUser">Name_of_user</div><div class="hp-avatar">👤</div></div>
    </nav>
  </header>

  <main class="mm-main" id="mmMain">
    <div class="mm-banner">
      <div style="display:flex;align-items:center;gap:12px;">
        <h1 class="mm-title">Memories <span id="mmPetName" style="color:#114a43;font-weight:800;"></span></h1>
      </div>

      <div style="display:flex;gap:12px;align-items:center;">
        <div class="mm-avatar" id="mmAvatar"><img src="images/default-pet.png" alt="pet avatar" style="width:100%;height:100%;object-fit:cover;"></div>
        <button id="mmAdd" class="btn-add">Add memory</button>
      </div>
    </div>

    <section class="mem-list" id="memList" aria-live="polite">
      <!-- memory items injected here -->
    </section>
  </main>
</div>

<script>
  (function(){
    function q(name){ return new URLSearchParams(location.search).get(name); }
    const petId = q('id');
    if (!petId) { location.href = 'my-pets.html'; return; }

    // load pet + user
    let pets = [];
    try { pets = JSON.parse(localStorage.getItem('petlink_pets') || '[]'); } catch(e){ pets = []; }
    const pet = pets.find(p => p.id === petId);
    if (!pet) { location.href = 'my-pets.html'; return; }

    document.getElementById('mmPetName').textContent = pet.name || '';
    document.getElementById('mmAvatar').querySelector('img').src = pet.image || 'images/default-pet.png';
    const email = localStorage.getItem('petlink_user_email');
    if (email) document.getElementById('mmUser').textContent = email.split('@')[0].replace(/[._\-+]+/g,' ').split(' ').map(s=> s? s[0].toUpperCase()+s.slice(1):'').join(' ');

    // storage per-pet
    const key = 'petlink_memories_' + petId;
    function load() {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
    }
    function save(arr){ try { localStorage.setItem(key, JSON.stringify(arr)); } catch(e){} }

    // ensure a demo memory exists if none
    let memories = load();
    if (memories.length === 0) {
      memories = [{
        id: 'm1',
        date: '2025-05-06',
        text: "Enjoying a sunny day at the park!",
        image: '' // optional data url
      }];
      save(memories);
    }

    const list = document.getElementById('memList');
    function render(){
      list.innerHTML = '';
      memories.slice().reverse().forEach(m => {
        const item = document.createElement('article');
        item.className = 'mem-item';

        const thumb = document.createElement('div');
        thumb.className = 'mem-thumb';
        if (m.image) {
          const img = document.createElement('img'); img.src = m.image; img.alt = m.text || 'memory';
          thumb.appendChild(img);
        } else {
          const img = document.createElement('img'); img.src = 'images/default-pet.png'; img.alt = 'pet';
          thumb.appendChild(img);
        }

        const body = document.createElement('div'); body.className = 'mem-body';
        const date = document.createElement('div'); date.className = 'mem-date'; date.textContent = m.date ? new Date(m.date + 'T00:00:00').toLocaleDateString() : '';
        const text = document.createElement('div'); text.className = 'mem-text'; text.textContent = m.text || '';

        body.appendChild(date); body.appendChild(text);

        item.appendChild(thumb);
        item.appendChild(body);

        list.appendChild(item);
      });
    }

    render();

    // Add button navigates to add-memory page for this pet
    document.getElementById('mmAdd').addEventListener('click', () => {
      location.href = 'add-memory.html?id=' + encodeURIComponent(petId);
    });

    // header nav
    document.getElementById('navMyPets').addEventListener('click', () => location.href = 'my-pets.html');
    document.getElementById('navDaily').addEventListener('click', () => alert('Daily care — placeholder'));
    document.getElementById('navHome').addEventListener('click', () => location.href = 'homepage.html');
  })();
</script>
</body>
</html>
