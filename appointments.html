<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PetLink — Appointments</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Scoped styles for the Appointments page (updated month visuals) */
    .ap-page { min-height:100vh; background: linear-gradient(180deg,#eaf9f3 0%, #f6d6dc 60%); padding:28px; display:flex; flex-direction:column; gap:20px; }
    .ap-main { max-width:980px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:18px; align-items:center; }
    .ap-banner {
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85));
      border-radius:32px;
      padding:14px 20px;
      display:flex;
      align-items:center;
      gap:18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      width:100%;
      justify-content:space-between;
    }
    .ap-title { font-size:28px; font-weight:800; color:var(--pink); margin:0; display:flex; align-items:center; gap:16px; }
    .ap-avatar { width:60px; height:60px; border-radius:12px; overflow:hidden; background:white; display:flex; align-items:center; justify-content:center; }

    /* Months row */
    .ap-months {
      width:100%;
      margin-top:12px;
      display:flex;
      justify-content:center;
    }
    .months-wrap {
      background:white;
      padding:18px;
      border-radius:14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.06);
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      min-width:360px;
    }

    /* Updated month button: circular, strong contrast when has events, selected is light pink */
    .month {
      width:48px;
      height:48px;
      padding:0;
      border-radius:50%;
      color:#111;
      font-weight:800;
      cursor:pointer;
      background:transparent;
      border:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition: background-color .18s ease, box-shadow .18s ease, transform .12s ease;
      box-shadow: none;
      user-select: none;
    }

    /* Gray circle if this month has events */
    .month.has-events {
      background: #bfc3c6;   /* visible gray */
      color: #101010;
      box-shadow: 0 6px 10px rgba(0,0,0,0.06);
    }

    /* Selected month: light pink circle (distinct from 'has-events') */
    .month.selected {
      background: #ffd7de;   /* light pink */
      color: #6b2e3a;
      box-shadow: 0 8px 18px rgba(203,84,105,0.08);
      transform: translateY(-2px);
    }

    /* If selected also has events, keep selected pink precedence */
    .month.selected.has-events { background: #ffd7de; }

    .month.now {
      /* subtle ring for current month if not selected */
      box-shadow: inset 0 -6px 12px rgba(255,255,255,0.25);
    }

    .month:focus { outline: 3px solid rgba(0,0,0,0.06); }

    .appointments-list { width:100%; display:flex; flex-direction:column; gap:16px; margin-top:20px; align-items:center; }
    .record {
      background:white; border-radius:18px; padding:14px 18px; box-shadow: 0 22px 50px rgba(0,0,0,0.06); display:flex; align-items:center; gap:12px; justify-content:space-between;
      width:100%;
    }
    .record-left { display:flex; align-items:center; gap:12px; min-width:0; }
    .record .icon { width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f4f4f4); }
    .record .meta { min-width:0; }
    .record .meta .title { font-weight:800; color:#222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .record .meta .date { color:var(--muted); font-size:13px; margin-top:6px; }

    .status { font-weight:800; padding:8px 14px; border-radius:999px; min-width:84px; text-align:center; display:inline-block; }
    .status-upcoming { background: #fff4cf; color: #b37c16; }
    .status-done { background:#e7fbf0; color:#0f6c53; }

    .status-toggle {
      margin-left:12px;
      background:transparent;
      border:1px solid rgba(0,0,0,0.06);
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      min-width:56px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
      background: #fff;
    }

    .btn-back { padding:8px 12px; border-radius:999px; border:0; cursor:pointer; background:white; box-shadow:0 6px 18px rgba(0,0,0,0.06); font-weight:700; }

    @media(max-width:720px){
      .ap-banner { flex-direction:column; align-items:flex-start; gap:10px; padding:12px; }
      .months-wrap { padding:12px; }
      .record { flex-direction:column; align-items:flex-start; gap:8px; }
    }
  </style>
</head>
<body>
<div class="ap-page">
  <header class="hp-header" style="max-width:980px; margin:0 auto;">
    <div class="hp-brand">
      <div class="hp-logo">
        <div class="hp-logo-mark" title="PetLink logo"><img src="images/default-logo.png" width="36" height="36" style="border-radius:8px;background:#fff"></div>
        <div class="hp-logo-text">PetLink</div>
      </div>
    </div>
    <nav style="display:flex; gap:18px; align-items:center;">
      <button id="navMyPets" class="hp-menu-item" style="background:transparent;border:0;">My pets</button>
      <button id="navDaily" class="hp-menu-item" style="background:transparent;border:0;">Daily care</button>
      <button id="navHome" class="hp-menu-item" style="background:transparent;border:0;">Homepage</button>
      <div class="hp-user" style="cursor:default;"><div class="hp-user-name" id="apUser">Name_of_user</div><div class="hp-avatar">👤</div></div>
    </nav>
  </header>

  <main class="ap-main" role="main" id="apMain">
    <div class="ap-banner">
      <div style="display:flex;align-items:center;gap:12px;">
        <h1 class="ap-title">Appointments <span id="apPetName" style="color:#114a43;font-weight:800;"></span></h1>
      </div>

      <div style="display:flex;gap:12px;align-items:center;">
        <div class="ap-avatar" id="apAvatar"><img src="images/default-pet.png" alt="pet avatar" style="width:100%;height:100%;object-fit:cover;"></div>
        <button id="apBackProfile" class="btn-back">Back to profile</button>
      </div>
    </div>

    <div class="ap-months" aria-hidden="false">
      <div class="months-wrap" id="monthsWrap" role="list" aria-label="Months">
        <!-- month buttons injected here -->
      </div>
    </div>

    <div class="appointments-list" id="appointmentsList" aria-live="polite">
      <!-- appointments inserted here -->
    </div>
  </main>
</div>

<script>
  (function(){
    // helpers
    function q(name){ const p = new URLSearchParams(location.search); return p.get(name); }
    const petId = q('id');
    if (!petId) { location.href = 'my-pets.html'; return; }

    // load pet and user name
    let pets = [];
    try { pets = JSON.parse(localStorage.getItem('petlink_pets') || '[]'); } catch(e){ pets = []; }
    const pet = pets.find(p => p.id === petId);
    if (!pet) { location.href = 'my-pets.html'; return; }

    document.getElementById('apPetName').textContent = pet.name || '';
    document.getElementById('apAvatar').querySelector('img').src = pet.image || 'images/default-pet.png';
    const email = localStorage.getItem('petlink_user_email');
    if (email) document.getElementById('apUser').textContent = email.split('@')[0].replace(/[._\-+]+/g,' ').split(' ').map(s=>s? s[0].toUpperCase()+s.slice(1):'').join(' ');

    // load per-pet health records (same key used by health-records)
    const storageKey = 'petlink_health_' + petId;
    function loadRecords(){
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) {
          // ensure defaults exist (so demo shows something)
          const defaults = {
            vaccinations: [
              { id: 'r1', title: 'Rabies booster', date: '2025-11-20', status:'upcoming' },
              { id: 'r2', title: 'DHPP', date: '2025-08-14', status:'done' }
            ],
            medication: [],
            vet: [],
            allergies: [],
            weight: []
          };
          localStorage.setItem(storageKey, JSON.stringify(defaults));
          return defaults;
        }
        return JSON.parse(raw);
      } catch(e){ return { vaccinations:[], medication:[], vet:[], allergies:[], weight:[] }; }
    }
    let records = loadRecords();

    // Combine vaccinations + vet visits into a single appointments list
    function buildAppointments() {
      const arr = [];
      (records.vaccinations || []).forEach(r => arr.push(Object.assign({}, r, { type: 'vaccination' })));
      (records.vet || []).forEach(r => arr.push(Object.assign({}, r, { type: 'vet' })));
      // normalize date
      arr.forEach(a => {
        a._dateObj = a.date ? new Date(a.date + 'T00:00:00') : null;
      });
      // sort by date ascending (nulls at the end)
      arr.sort((x,y) => {
        if (!x._dateObj && !y._dateObj) return 0;
        if (!x._dateObj) return 1;
        if (!y._dateObj) return -1;
        return x._dateObj - y._dateObj;
      });
      return arr;
    }

    let appointments = buildAppointments();

    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthsWrap = document.getElementById('monthsWrap');
    const listWrap = document.getElementById('appointmentsList');

    // determine which months have events
    function monthHasEvents(index){
      return appointments.some(a => a._dateObj && a._dateObj.getMonth() === index);
    }

    // render months row; selectedMonth = number 0..11 or null for "all"
    let selectedMonth = (new Date()).getMonth();

    function renderMonths(){
      monthsWrap.innerHTML = '';
      months.forEach((m, i) => {
        const btn = document.createElement('button');
        btn.className = 'month';
        if (i === (new Date()).getMonth()) btn.classList.add('now');
        if (monthHasEvents(i)) btn.classList.add('has-events');
        if (i === selectedMonth) btn.classList.add('selected');
        btn.textContent = m;
        btn.setAttribute('role','button');
        btn.setAttribute('aria-pressed', i === selectedMonth ? 'true' : 'false');
        btn.addEventListener('click', () => {
          selectedMonth = i;
          renderMonths();
          renderList();
        });
        monthsWrap.appendChild(btn);
      });

      // also allow clearing selection (show all)
      const clearBtn = document.createElement('button');
      clearBtn.className = 'month';
      clearBtn.textContent = 'All';
      clearBtn.setAttribute('role','button');
      clearBtn.addEventListener('click', () => {
        selectedMonth = null;
        renderMonths();
        renderList();
      });
      monthsWrap.appendChild(clearBtn);
    }

    function formatDateNice(d){
      try {
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      } catch(e){ return d; }
    }

    // Render appointments list filtered by selectedMonth (if set)
    function renderList(){
      listWrap.innerHTML = '';
      const arr = appointments.filter(a => {
        if (selectedMonth === null) return true;
        if (!a._dateObj) return false;
        return a._dateObj.getMonth() === selectedMonth;
      });

      if (arr.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = 'var(--muted)';
        empty.style.padding = '18px';
        empty.textContent = 'No appointments for this month.';
        listWrap.appendChild(empty);
        return;
      }

      arr.forEach(r => {
        const el = document.createElement('div');
        el.className = 'record';

        const left = document.createElement('div'); left.className = 'record-left';
        const icon = document.createElement('div'); icon.className = 'icon';
        icon.textContent = r.type === 'vaccination' ? '💉' : '🩺';
        const meta = document.createElement('div'); meta.className = 'meta';
        const title = document.createElement('div'); title.className = 'title'; title.textContent = r.title || '';
        const dateEl = document.createElement('div'); dateEl.className = 'date'; dateEl.textContent = r.date ? 'due ' + formatDateNice(r.date) : '';
        meta.appendChild(title); meta.appendChild(dateEl);
        left.appendChild(icon); left.appendChild(meta);

        // status badge
        const statusBadge = document.createElement('div');
        statusBadge.className = 'status ' + (r.status === 'done' ? 'status-done' : 'status-upcoming');
        statusBadge.textContent = r.status === 'done' ? 'DONE' : 'UPCOMING';
        statusBadge.setAttribute('aria-hidden','true');

        // toggle button
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'status-toggle';
        toggle.textContent = r.status === 'done' ? 'Mark upcoming' : 'Mark done';
        toggle.title = toggle.textContent;
        toggle.setAttribute('aria-pressed', r.status === 'done' ? 'true' : 'false');
        toggle.addEventListener('click', (ev) => {
          ev.stopPropagation();
          // flip status in the underlying records structure and persist
          const targetArr = r.type === 'vaccination' ? records.vaccinations : records.vet;
          const rec = targetArr.find(x => x.id === r.id);
          if (!rec) return;
          rec.status = rec.status === 'done' ? 'upcoming' : 'done';
          try { localStorage.setItem(storageKey, JSON.stringify(records)); } catch(e){}
          // rebuild appointments and rerender
          appointments = buildAppointments();
          renderMonths();
          renderList();
        });

        const rightWrap = document.createElement('div');
        rightWrap.style.display = 'flex';
        rightWrap.style.alignItems = 'center';
        rightWrap.appendChild(statusBadge);
        rightWrap.appendChild(toggle);

        el.appendChild(left);
        el.appendChild(rightWrap);

        listWrap.appendChild(el);
      });
    }

    // initial render
    appointments = buildAppointments();
    renderMonths();
    renderList();

    // nav wiring
    document.getElementById('navMyPets').addEventListener('click', ()=> location.href='my-pets.html');
    document.getElementById('navDaily').addEventListener('click', ()=> alert('Daily care — placeholder'));
    document.getElementById('navHome').addEventListener('click', ()=> location.href='homepage.html');

    // Back to profile button
    document.getElementById('apBackProfile').addEventListener('click', () => {
      location.href = 'pet-profile.html?id=' + encodeURIComponent(petId);
    });
  })();
</script>
</body>
</html>
